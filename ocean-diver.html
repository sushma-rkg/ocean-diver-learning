<title>Ocean Diver</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  html, body {
    width: 100%; height: 100%;
    margin: 0; overflow: hidden;
    background: #020810;
    touch-action: none;
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }
</style>

<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Input
const mouse = { x: null, y: null };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('touchstart', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove', e => { e.preventDefault(); mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, { passive: false });

// Diver state
const diver = { x: 0, y: 0, vx: 0, vy: 0, angle: 0, facingRight: true };
let started = false;

// Bubbles
const bubbles = [];
let bTimer = 0;

function spawnBubble(wx, wy) {
  bubbles.push({
    x: wx + (Math.random() - 0.5) * 6,
    y: wy,
    r: 2 + Math.random() * 4,
    vy: 0.5 + Math.random() * 0.7,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpd: 0.03 + Math.random() * 0.03,
    wobbleAmp: 0.4 + Math.random() * 0.5,
    alpha: 0.45 + Math.random() * 0.35
  });
}

function drawOcean(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1e5282');
  g.addColorStop(0.18, '#0e2d55');
  g.addColorStop(0.6, '#061428');
  g.addColorStop(1, '#020810');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Light rays
  const drift = Math.sin(t * 0.08) * 25;
  for (let i = 0; i < 6; i++) {
    const cx = (W / 7) * (i + 1) + drift;
    const spread = W * 0.07 + Math.sin(t * 0.11 + i) * 10;
    const rg = ctx.createLinearGradient(cx, 0, cx, H * 0.7);
    rg.addColorStop(0, 'rgba(120,210,255,0.08)');
    rg.addColorStop(1, 'rgba(120,210,255,0)');
    ctx.beginPath();
    ctx.moveTo(cx - 12, 0); ctx.lineTo(cx + 12, 0);
    ctx.lineTo(cx + spread, H * 0.7); ctx.lineTo(cx - spread * 0.6, H * 0.7);
    ctx.closePath();
    ctx.fillStyle = rg;
    ctx.fill();
  }

  // Surface wave
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (let x = 0; x <= W; x += 8) {
    ctx.lineTo(x, 8 + Math.sin(x / 65 + t * 1.1) * 5 + Math.sin(x / 30 + t * 1.7) * 2);
  }
  ctx.lineTo(W, 0);
  ctx.closePath();
  const sg = ctx.createLinearGradient(0, 0, 0, 20);
  sg.addColorStop(0, 'rgba(100,200,255,0.35)');
  sg.addColorStop(1, 'rgba(100,200,255,0)');
  ctx.fillStyle = sg;
  ctx.fill();
}

function drawDiver(x, y, facingRight, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  if (!facingRight) ctx.scale(-1, 1);

  // Tank
  ctx.fillStyle = '#b03020';
  ctx.beginPath(); ctx.roundRect(-26, -7, 10, 26, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.roundRect(-25, -5, 3, 8, 2); ctx.fill();

  // Body
  ctx.fillStyle = '#1a3552';
  ctx.beginPath(); ctx.roundRect(-16, -12, 32, 34, 8); ctx.fill();
  ctx.fillStyle = '#236fa3';
  ctx.beginPath(); ctx.roundRect(-14, 0, 28, 9, 4); ctx.fill();

  // Arms
  ctx.strokeStyle = '#1a3552'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-14, -2); ctx.quadraticCurveTo(-30, 7, -24, 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14, -2); ctx.quadraticCurveTo(30, 7, 24, 20); ctx.stroke();

  // Flippers
  ctx.fillStyle = '#e8920f';
  ctx.beginPath(); ctx.ellipse(-4, 30, 7, 15, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10, 30, 7, 15, 0.2, 0, Math.PI * 2); ctx.fill();

  // Helmet
  ctx.fillStyle = '#1a3552';
  ctx.beginPath(); ctx.arc(2, -22, 18, 0, Math.PI * 2); ctx.fill();

  // Visor frame
  ctx.fillStyle = '#0d1f34';
  ctx.beginPath(); ctx.ellipse(5, -22, 14, 11, 0, 0, Math.PI * 2); ctx.fill();

  // Visor glass
  const vg = ctx.createRadialGradient(-1, -27, 1, 5, -22, 13);
  vg.addColorStop(0, 'rgba(180,245,255,0.92)');
  vg.addColorStop(0.5, 'rgba(60,160,230,0.75)');
  vg.addColorStop(1, 'rgba(20,80,160,0.55)');
  ctx.fillStyle = vg;
  ctx.beginPath(); ctx.ellipse(5, -22, 12, 9, 0, 0, Math.PI * 2); ctx.fill();

  // Visor glare
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(0, -27, 5, 2, -0.3, 0, Math.PI * 2); ctx.fill();

  // Regulator hose
  ctx.strokeStyle = '#8a9ba8'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(17, -14); ctx.quadraticCurveTo(24, -6, 22, 6); ctx.stroke();
  ctx.fillStyle = '#9aabb8';
  ctx.beginPath(); ctx.arc(22, 6, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c0ced8';
  ctx.beginPath(); ctx.arc(22, 6, 3, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawBubbles() {
  for (const b of bubbles) {
    ctx.save();
    ctx.globalAlpha = b.alpha;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(165,230,255,0.12)'; ctx.fill();
    ctx.strokeStyle = 'rgba(165,230,255,0.7)'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.32, b.y - b.r * 0.32, b.r * 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function update(dt) {
  if (!started) {
    diver.x = W / 2; diver.y = H * 0.55;
    mouse.x = W / 2; mouse.y = H * 0.55;
    started = true;
  }

  const tx = mouse.x ?? W / 2;
  const ty = mouse.y ?? H * 0.55;

  const lf = 1 - Math.pow(0.95, dt);
  const px = diver.x, py = diver.y;
  diver.x += (tx - diver.x) * lf;
  diver.y += (ty - diver.y) * lf;
  diver.vx = diver.x - px;
  diver.vy = diver.y - py;

  const speed = Math.sqrt(diver.vx ** 2 + diver.vy ** 2);

  if (Math.abs(diver.vx) > 0.15) diver.facingRight = diver.vx > 0;

  const targetAngle = speed > 0.3
    ? Math.max(-0.48, Math.min(0.48, Math.atan2(diver.vy, Math.abs(diver.vx)) * 0.55))
    : 0;
  diver.angle += (targetAngle - diver.angle) * 0.09 * dt;

  // Spawn bubble from regulator position
  bTimer += dt;
  const bRate = Math.max(6, 22 - speed * 3);
  if (bTimer >= bRate) {
    bTimer = 0;
    const lx = diver.facingRight ? 22 : -22;
    const ly = 6;
    const c = Math.cos(diver.angle), s = Math.sin(diver.angle);
    spawnBubble(diver.x + lx * c - ly * s, diver.y + lx * s + ly * c);
  }

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.wobble += b.wobbleSpd * dt;
    b.x += Math.sin(b.wobble) * b.wobbleAmp;
    b.y -= b.vy * dt;
    b.alpha -= 0.0025 * dt;
    if (b.y < -b.r || b.alpha <= 0) bubbles.splice(i, 1);
  }
}

let lastTs = 0;
function loop(ts) {
  const dt = lastTs ? Math.min((ts - lastTs) / 16.67, 4) : 1;
  lastTs = ts;
  update(dt);
  drawOcean(ts / 1000);
  drawBubbles();
  drawDiver(diver.x, diver.y, diver.facingRight, diver.angle);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
